<table class="table table-striped table-hover">
  <thead>
    <tr class="table-light">
      <th class="display-4 text-center">Lista de Películas</th>
      <th class="text-end">
        <button class="btn btn-success" routerLink="add">
          <i class="fas fa-plus"></i> Añadir
        </button>
      </th>
    </tr>
  </thead>
  <tbody>
    @for (item of VM.Listado; track item.filmId) {
    <tr class="table-light">
      <td class="text-center">
        <div class="container">
          <div class="row justify-content-center">
            <div class="col-md-10">
              <a
                class="btn btn-link btn-lg px-0 text-dark"
                routerLink="{{ item.filmId }}/{{ item.title }}"
              >
                <h5 class="mb-0">{{ item.title }}</h5>
              </a>
              <p class="text-muted" style="font-size: 0.85rem; text-align: center;">
                {{ item.description }}
              </p>
              <br />
            </div>
          </div>
        </div>
      </td>
      <td class="align-middle text-center">
        <div class="btn-group" role="group">
          <button class="btn btn-success" [routerLink]="[item.filmId, 'edit']">
            <i class="fas fa-pen"></i>
          </button>
          <button class="btn btn-danger" (click)="VM.delete(item.filmId)">
            <i class="far fa-trash-alt"></i>
          </button>
        </div>
      </td>
    </tr>
    }
  </tbody>
</table>
